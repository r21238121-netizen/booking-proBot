<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Booking Pro</title>
  <script>
    // Эмуляция Telegram WebApp в браузере
    if (typeof window.Telegram === 'undefined') {
      window.Telegram = {
        WebApp: {
          initDataUnsafe: { user: { id: 7223040599, first_name: "Илья", username: "ilya_dev" } },
          ready: () => console.log("✅ Браузерный режим (тест)"),
          expand: () => {},
          close: () => window.close(),
          openLink: (url) => window.open(url, '_blank'),
          showPopup: (p) => alert(`${p.title}\n${p.message}`),
          BackButton: { onClick: (f) => window.history.back(), show: () => {}, hide: () => {} }
        }
      };
    }
  </script>
  <style>
    :root {
      --bg: #1e1f22;
      --card-bg: #2a2b2e;
      --border: #3a3b3f;
      --text: #f0f0f0;
      --primary: #0088cc;
      --ad-bg: #2e2e2e;
      --ad-text: #ff9800;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 600px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 24px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      margin: 12px 0;
      cursor: pointer;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
    }
    .master-item {
      background: #35363a;
      padding: 16px;
      border-radius: 12px;
      margin: 10px 0;
      cursor: pointer;
    }
    .slot {
      display: inline-block;
      background: var(--border);
      color: var(--text);
      padding: 8px 16px;
      margin: 6px;
      border-radius: 20px;
      cursor: pointer;
    }
    .slot.selected {
      background: var(--primary);
      color: white;
    }
    .ad-banner {
      background: var(--ad-bg);
      color: var(--ad-text);
      padding: 12px;
      text-align: center;
      border-radius: 10px;
      margin: 16px 0;
      font-size: 14px;
      cursor: pointer;
    }
    select, input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
    }
    .hidden { display: none; }
    .badge {
      background: var(--primary);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="header">
      <h2>📅 Booking Pro</h2>
      <p>Запись к мастерам по всей России</p>
    </div>

    <!-- Шаг 1: выбор города и услуги -->
    <div id="step1" class="card">
      <h3>Выберите город и услугу</h3>
      <select id="city-select" placeholder="Город">
        <option value="">Загрузка городов...</option>
      </select>
      <select id="service-select" placeholder="Услуга">
        <option value="">Загрузка услуг...</option>
      </select>
      <button class="btn" onclick="loadMasters()">Найти мастеров</button>
    </div>

    <!-- Шаг 2: список мастеров -->
    <div id="step2" class="hidden">
      <div class="ad-banner" id="ad-banner" onclick="openAd()"></div>
      <div id="masters-list"></div>
      <button class="btn btn-outline" onclick="backToSearch()">Изменить поиск</button>
    </div>

    <!-- Шаг 3: выбор времени -->
    <div id="step3" class="hidden">
      <h3 id="master-name"></h3>
      <div id="slots-list"></div>
      <button class="btn" onclick="confirmBooking()">Подтвердить запись</button>
      <button class="btn btn-outline" onclick="backToMasters()">Назад к мастерам</button>
    </div>
  </div>

  <script>
    const WebApp = window.Telegram.WebApp;
    WebApp.ready();
    WebApp.expand();
    WebApp.BackButton.show();
    WebApp.BackButton.onClick(() => {
      if (!document.getElementById('step3').classList.contains('hidden')) {
        backToMasters();
      } else if (!document.getElementById('step2').classList.contains('hidden')) {
        backToSearch();
      }
    });

    const user = WebApp.initDataUnsafe?.user;
    const API_URL = "https://myyclients.netlify.app/"; // ← замени на рендер в продакшене
    let CURRENT_CITY = "";
    let CURRENT_SERVICE = "";

    // Загрузка городов и услуг
    async function init() {
      try {
        const [citiesRes, servicesRes] = await Promise.all([
          fetch(`${API_URL}/api/cities`),
          fetch(`${API_URL}/api/services`)
        ]);
        const cities = await citiesRes.json();
        const services = await servicesRes.json();

        const citySelect = document.getElementById("city-select");
        citySelect.innerHTML = '<option value="">Выберите город</option>' + 
          cities.map(c => `<option value="${c}">${c}</option>`).join("");

        const serviceSelect = document.getElementById("service-select");
        serviceSelect.innerHTML = '<option value="">Выберите услугу</option>' + 
          services.map(s => `<option value="${s}">${s}</option>`).join("");
      } catch (e) {
        alert("Ошибка подключения к серверу. Проверьте, запущен ли backend.");
        console.error(e);
      }
    }

    // Загрузка мастеров
    async function loadMasters() {
      const city = document.getElementById("city-select").value;
      const service = document.getElementById("service-select").value;
      if (!city || !service) {
        alert("Выберите город и услугу");
        return;
      }
      CURRENT_CITY = city;
      CURRENT_SERVICE = service;

      try {
        const res = await fetch(`${API_URL}/api/masters?city=${encodeURIComponent(city)}&service=${encodeURIComponent(service)}`);
        const masters = await res.json();

        const list = document.getElementById("masters-list");
        if (masters.length === 0) {
          list.innerHTML = `<p>Нет мастеров в ${escapeHtml(city)} по услуге "${escapeHtml(service)}".</p>`;
        } else {
          list.innerHTML = masters.map(m => `
            <div class="master-item" onclick="showSlots(${parseInt(m.id)}, '${escapeHtml(m.name)}')">
              <strong>${escapeHtml(m.name)}</strong>
              <div>📍 ${escapeHtml(m.address)}</div>
              <div>⭐ ${parseFloat(m.rating).toFixed(1)} (${parseInt(m.review_count)})</div>
            </div>
          `).join("");
        }

        // Загружаем рекламу
        const adRes = await fetch(`${API_URL}/api/ad`);
        const ad = await adRes.json();
        document.getElementById("ad-banner").innerText = escapeHtml(ad.text);
        window.AD_URL = escapeHtml(ad.url);

        document.getElementById("step1").classList.add("hidden");
        document.getElementById("step2").classList.remove("hidden");
      } catch (e) {
        alert("Ошибка загрузки мастеров");
        console.error(e);
      }
    }

    // Функция для экранирования HTML
    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function openAd() {
      WebApp.openLink(window.AD_URL);
    }

    function showSlots(masterId, name) {
      document.getElementById("master-name").innerText = `Выберите время к ${name}`;
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step3").classList.remove("hidden");

      fetch(`${API_URL}/api/slots/${masterId}`)
        .then(r => r.json())
        .then(slots => {
          const list = document.getElementById("slots-list");
          if (slots.length === 0) {
            list.innerHTML = "<p>Нет свободных слотов на ближайшие 14 дней.</p>";
            return;
          }
          list.innerHTML = slots.map(slot => {
            const d = new Date(slot);
            const label = d.toLocaleString("ru", {
              day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
            });
            return `<div class="slot" onclick="selectSlot('${slot}', this)">${label}</div>`;
          }).join("");
        });
    }

    let SELECTED_SLOT = null;
    function selectSlot(slot, el) {
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      SELECTED_SLOT = slot;
    }

    async function confirmBooking() {
      if (!SELECTED_SLOT) {
        alert("Выберите время");
        return;
      }
      try {
        const res = await fetch(`${API_URL}/api/book`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            client_id: user.id,
            master_id: SELECTED_SLOT_MASTER_ID,
            slot: SELECTED_SLOT
          })
        });
        if (res.ok) {
          WebApp.showPopup({ title: "✅ Успех!", message: "Вы записаны! Бот пришлёт напоминание." });
          setTimeout(() => WebApp.close(), 2000);
        } else {
          throw new Error("Ошибка записи");
        }
      } catch (e) {
        alert("Не удалось записаться. Попробуйте позже.");
        console.error(e);
      }
    }

    function backToSearch() {
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step1").classList.remove("hidden");
    }

    function backToMasters() {
      document.getElementById("step3").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
    }

    // Глобальные переменные для записи
    let SELECTED_SLOT_MASTER_ID = null;
    function showSlots(masterId, name) {
      SELECTED_SLOT_MASTER_ID = masterId;
      // ... остальное как выше
    }

    // Запуск
    init();
  </script>
</body>
</html>
